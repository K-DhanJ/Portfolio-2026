<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title description">
  <title id="title">Schéma du perceptron</title>
  <desc id="description">Une grille de 48 pixels traverse une somme pondérée avant de produire une classification binaire ou une sortie parmi dix chiffres.</desc>
  <!-- Schéma pédagogique des étapes décrites dans le rapport ; il ne représente pas une mesure expérimentale. -->
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#172532"/><stop offset="1" stop-color="#101116"/></linearGradient>
    <linearGradient id="accent" x2="1" y2="1"><stop stop-color="#6fd3eb"/><stop offset="1" stop-color="#a2c9ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="pixels" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse"><rect x="2" y="2" width="22" height="22" rx="4" fill="#7891a5" opacity=".26"/></pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#background)"/>
  <circle cx="600" cy="300" r="155" fill="#53b8e0" opacity=".08" filter="url(#glow)"/>
  <path d="M330 300H465M735 300H855" stroke="url(#accent)" stroke-width="3" opacity=".75"/>
  <path d="m452 289 15 11-15 11m390-22 15 11-15 11" fill="none" stroke="#9cdbef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="95" y="170" width="235" height="300" rx="20" fill="#172532" stroke="#83b9d0" stroke-opacity=".55"/>
  <rect x="128" y="207" width="168" height="224" fill="url(#pixels)"/>
  <g fill="url(#accent)">
    <rect x="158" y="237" width="22" height="22" rx="4"/><rect x="186" y="237" width="22" height="22" rx="4"/><rect x="214" y="237" width="22" height="22" rx="4"/>
    <rect x="130" y="265" width="22" height="22" rx="4"/><rect x="242" y="265" width="22" height="22" rx="4"/>
    <rect x="130" y="293" width="22" height="22" rx="4"/><rect x="242" y="293" width="22" height="22" rx="4"/>
    <rect x="130" y="321" width="22" height="22" rx="4"/><rect x="242" y="321" width="22" height="22" rx="4"/>
    <rect x="130" y="349" width="22" height="22" rx="4"/><rect x="242" y="349" width="22" height="22" rx="4"/>
    <rect x="158" y="377" width="22" height="22" rx="4"/><rect x="186" y="377" width="22" height="22" rx="4"/><rect x="214" y="377" width="22" height="22" rx="4"/>
  </g>
  <circle cx="600" cy="300" r="130" fill="#1b2c39" stroke="#84cde1" stroke-opacity=".8" stroke-width="2"/>
  <circle cx="600" cy="300" r="105" fill="none" stroke="#8bc9dd" stroke-opacity=".18"/>
  <text x="600" y="312" fill="#f5fbff" text-anchor="middle" font-size="48" font-family="Arial, sans-serif">Σ wᵢxᵢ</text>
  <text x="600" y="359" fill="#a9cad7" text-anchor="middle" font-size="23" font-family="Arial, sans-serif">Σ wᵢxᵢ → y</text>
  <rect x="870" y="195" width="250" height="105" rx="18" fill="#1a2e3c" stroke="#78cde1" stroke-opacity=".6"/>
  <text x="995" y="263" fill="#eaf8ff" text-anchor="middle" font-size="46" font-family="Arial, sans-serif">0 / 1</text>
  <rect x="870" y="325" width="250" height="105" rx="18" fill="#1a2e3c" stroke="#78cde1" stroke-opacity=".6"/>
  <text x="995" y="393" fill="#eaf8ff" text-anchor="middle" font-size="42" font-family="Arial, sans-serif">0 … 9</text>
  <text x="212" y="525" fill="#b4cbd6" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">48 pixels</text>
  <text x="600" y="525" fill="#b4cbd6" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">Σ w·x</text>
  <text x="995" y="525" fill="#b4cbd6" text-anchor="middle" font-size="24" font-family="Arial, sans-serif">0–9</text>
</svg>
